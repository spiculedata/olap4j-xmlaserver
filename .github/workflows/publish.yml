name: publish

# Deploys this artifact to GitHub Packages on tag push (v*) or manual dispatch.
# Generic across spiculedata olap4j repos: the deploy URL is derived from
# ${{ github.repository }} so the same workflow works for olap4j and
# olap4j-xmlaserver without per-repo customization.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          # setup-java writes ~/.m2/settings.xml binding <id>github</id>
          # to the env vars below.
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Deploy to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # -DaltDeploymentRepository avoids needing <distributionManagement>
        # in pom.xml; the repository id MUST match the server-id above so
        # Maven picks up the credentials.
        run: >
          mvn -B -ntp -DskipTests deploy
          -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }}
